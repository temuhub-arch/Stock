name: Stock alerts
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min, weekdays, ~US market hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python alerts_job.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save alert state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add alerts_state.json
          git diff --staged --quiet || (git commit -m "update alert state" && git push)

